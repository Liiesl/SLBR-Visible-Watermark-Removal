name: SLBR-Next CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slbr-next:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install PyTorch (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision

      - name: Install test dependencies
        run: pip install -r requirements-ci.txt

      - name: Show environment
        run: |
          python --version
          python -m pip list

      - name: Run SLBR-Next core block tests
        run: python -m pytest -q -s tests/test_slbr_next --timeout=1800

  # The hosted Linux CPU runner cannot execute FP16 convolution. The v1 FP16
  # contract test is CUDA/MPS-gated and skips there; this job exercises the
  # same test on the paravirtual Metal GPU of GitHub's macOS 15 arm64 runners.
  fp16-mps:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install PyTorch (macOS MPS)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision

      - name: Install test dependencies
        run: pip install timm pytest pytest-timeout

      - name: Verify Metal/MPS availability
        run: |
          python -c "import torch; print(torch.__version__); print('mps_built=', torch.backends.mps.is_built(), 'mps_available=', torch.backends.mps.is_available()); assert torch.backends.mps.is_available(), 'MPS is not available on this runner'"

      - name: Run FP16 contract test (MPS)
        run: >
          python -m pytest -q -s
          tests/test_slbr_next/test_contract.py::test_fp16_contract
          --timeout=1800
